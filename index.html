<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Tests</title>
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f8f5;color:#1d2b24;line-height:1.5}
  header{background:#1f9d57;color:#fff;padding:22px 16px 26px}
  .wrap{max-width:560px;margin:0 auto}
  header h1{margin:0 0 4px;font-size:1.5rem}
  header p{margin:0;opacity:.92;font-size:.95rem}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid #d5e3db;border-radius:12px;padding:18px;margin-bottom:14px}
  label{display:block;font-weight:600;margin:14px 0 6px}
  label:first-child{margin-top:0}
  input,select{width:100%;padding:12px;font:inherit;font-size:1rem;border:1.5px solid #d5e3db;border-radius:8px;background:#fff;color:inherit;min-height:48px}
  input:focus,select:focus{outline:none;border-color:#1f9d57;box-shadow:0 0 0 3px rgba(31,157,87,.2)}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 20px;cursor:pointer;min-height:48px}
  .primary{background:#1f9d57;color:#fff;width:100%;font-size:1.05rem;margin-top:18px}
  .primary:hover{background:#157a42}
  .primary[disabled]{opacity:.6;cursor:default}
  .ghost{background:#fff;color:#157a42;border:1.5px solid #1f9d57}
  .err{color:#c8372d;font-weight:600;margin:14px 0 0}
  .hello{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .hello h2{margin:0;font-size:1.25rem}
  .hello p{margin:2px 0 0;color:#5f6f67}
  h3{font-size:1rem;margin:20px 2px 10px;color:#157a42}
  a.test{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #d5e3db;border-radius:12px;padding:16px;margin-bottom:12px;text-decoration:none;color:inherit;min-height:72px}
  a.test:hover,a.test:focus{border-color:#1f9d57}
  .g{flex:none;width:48px;height:48px;border-radius:50%;background:#e8f6ee;color:#157a42;font-weight:800;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
  .t{font-weight:700;font-size:1.05rem;display:block}
  .d{color:#5f6f67;font-size:.9rem}
  .empty{color:#5f6f67;text-align:center;padding:24px 8px}
</style>
<script src="config.js"></script>
<script src="portal.js"></script>
</head>
<body>
<header><div class="wrap"><h1>Math Tests</h1><p id="sub">Sign in to see your tests.</p></div></header>
<main>
  <noscript><div class="card">This page needs a web browser with scripts turned on. Open the link in Safari or Chrome.</div></noscript>

  <form class="card" id="login" autocomplete="off">
    <label for="grade">I am in</label>
    <select id="grade" required></select>
    <label for="name">User name</label>
    <input type="text" id="name" required autocapitalize="words" autocomplete="off" placeholder="Your name">
    <label for="pw">Password</label>
    <input type="password" id="pw" required autocomplete="off" placeholder="Your password">
    <p class="err" id="err" hidden></p>
    <button class="primary" id="go" type="submit">Sign in</button>
  </form>

  <section id="home" hidden>
    <div class="card hello">
      <div><h2 id="welcome"></h2><p id="whoGrade"></p></div>
      <button class="ghost" type="button" id="out">Sign out</button>
    </div>
    <h3>Your tests</h3>
    <div id="tests"></div>
  </section>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var grades=window.PORTAL_GRADES||[], sel=$('grade'), i, o;
  function opt(v,t){o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o);}
  opt('','Choose your grade');
  for(i=0;i<grades.length;i++) opt(grades[i],'Grade '+grades[i]);
  opt('staff','Teacher / Admin');

  function gradeLabel(s){return s.role==='student'?'Grade '+s.grade:(s.role==='admin'?'Admin':'Teacher');}

  function renderTests(s){
    var box=$('tests'); box.textContent='';
    var list=(s.tests||[]).filter(function(t){return /^[\w-]+\.html$/.test(t.file);});
    if(!list.length){var e=document.createElement('div');e.className='card empty';e.textContent='There are no tests for you yet.';box.appendChild(e);return;}
    list.forEach(function(t){
      var a=document.createElement('a'); a.className='test'; a.href=t.file;
      var g=document.createElement('span'); g.className='g'; g.textContent=t.grade;
      var w=document.createElement('span'), tt=document.createElement('span'), d=document.createElement('span');
      tt.className='t'; tt.textContent=t.title;
      d.className='d'; d.textContent='Grade '+t.grade+(t.questions?' · '+t.questions+' questions':'');
      w.appendChild(tt); w.appendChild(d); a.appendChild(g); a.appendChild(w); box.appendChild(a);
    });
  }
  function showHome(s){
    $('login').hidden=true; $('home').hidden=false;
    $('welcome').textContent='Welcome, '+s.name;
    $('whoGrade').textContent=gradeLabel(s);
    $('sub').textContent='Choose a test to start.';
    renderTests(s);
  }
  function showLogin(){ $('home').hidden=true; $('login').hidden=false; $('sub').textContent='Sign in to see your tests.'; }

  var MSG={invalid:'The grade, user name or password is not correct.',
           locked:'Too many tries. Please wait 10 minutes and try again.',
           not_configured:'The sign-in service is not set up yet.',
           network:'Could not reach the sign-in service. Check your internet and try again.'};

  $('login').addEventListener('submit',function(ev){
    ev.preventDefault();
    var err=$('err'), go=$('go'); err.hidden=true;
    go.disabled=true; go.textContent='Checking…';
    Portal.login(sel.value,$('name').value,$('pw').value,function(r){
      go.disabled=false; go.textContent='Sign in';
      $('pw').value='';
      if(r.ok){showHome(Portal.session());}
      else{err.textContent=MSG[r.error]||MSG.network; err.hidden=false;}
    });
  });
  $('out').addEventListener('click',function(){Portal.signOut();});

  var s=Portal.session();
  if(s){ showHome(s); Portal.refreshTests(function(r){ var n=Portal.session(); if(n){renderTests(n);} else {showLogin();} }); }
})();
</script>
</body>
</html>
