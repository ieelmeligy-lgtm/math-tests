<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f8f8c">
<title>Math Tests</title>
<style>
  :root{--turq:#17b3b0;--turq-deep:#0c7f7c;--turq-soft:#e2f5f4;--coffee:#4e3426;--coffee-mid:#7a5a47;--cream:#f7f2eb;--card:#fffdfa;--line:#e6dccf;--gold:#e0a526;--red:#b8392e}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:"Trebuchet MS","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--coffee);line-height:1.45;-webkit-font-smoothing:antialiased}
  /* woven-cloth header: turquoise shirt over a coffee hem */
  .top{position:relative;color:#fff;padding:34px 20px 62px;text-align:center;overflow:hidden;
    background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.055) 0 2px,transparent 2px 6px),
      repeating-linear-gradient(-45deg,rgba(0,0,0,.045) 0 2px,transparent 2px 6px),
      linear-gradient(160deg,#1cc2be 0%,#12a09d 55%,#0c7f7c 100%);
    border-bottom:6px solid var(--coffee)}
  .top svg{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}
  .top h1{position:relative;margin:0;font-size:1.75rem;letter-spacing:.2px;text-wrap:balance}
  .top p{position:relative;margin:6px 0 0;font-size:1rem;opacity:.95}
  main{max-width:480px;margin:-40px auto 0;padding:0 16px 32px;position:relative}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:0 10px 30px rgba(78,52,38,.10)}
  .lab{display:block;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--coffee-mid);margin:18px 0 8px}
  .lab:first-child{margin-top:0}
  .grades{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .gbtn{appearance:none;border:2px solid var(--line);background:#fff;color:var(--coffee);font:inherit;font-weight:800;font-size:1.25rem;border-radius:16px;min-height:56px;cursor:pointer;transition:transform .12s,background .12s,border-color .12s}
  .gbtn:active{transform:scale(.95)}
  .gbtn[aria-pressed=true]{background:var(--turq-deep);border-color:var(--turq-deep);color:#fff;box-shadow:0 6px 14px rgba(12,127,124,.35)}
  .staff{appearance:none;display:block;width:100%;margin-top:8px;border:2px dashed var(--line);background:transparent;color:var(--coffee-mid);font:inherit;font-weight:700;font-size:.9rem;border-radius:14px;min-height:44px;cursor:pointer}
  .staff[aria-pressed=true]{border-style:solid;border-color:var(--coffee);background:var(--coffee);color:#fff}
  input{width:100%;padding:14px;font:inherit;font-size:1.05rem;border:2px solid var(--line);border-radius:14px;background:#fff;color:inherit;min-height:52px}
  input:focus,.gbtn:focus-visible,.staff:focus-visible,.eye:focus-visible,.go:focus-visible,.out:focus-visible,a.test:focus-visible{outline:3px solid rgba(23,179,176,.45);outline-offset:2px;border-color:var(--turq-deep)}
  .pw{position:relative}
  .pw input{padding-right:76px}
  .eye{position:absolute;right:6px;top:6px;bottom:6px;border:0;background:var(--turq-soft);color:var(--turq-deep);font:inherit;font-weight:700;font-size:.85rem;border-radius:10px;padding:0 12px;cursor:pointer;min-width:60px}
  .go{appearance:none;width:100%;margin-top:22px;border:0;border-radius:16px;min-height:56px;font:inherit;font-weight:800;font-size:1.1rem;color:#fff;cursor:pointer;background:linear-gradient(180deg,#12a09d,#0c7f7c);box-shadow:0 8px 18px rgba(12,127,124,.35)}
  .go:active{transform:translateY(1px)}
  .go[disabled]{opacity:.65;cursor:default}
  .err{color:var(--red);font-weight:700;margin:14px 0 0;font-size:.95rem}
  /* home */
  .hello{display:flex;align-items:center;gap:16px}
  .ring{flex:none;position:relative;width:84px;height:84px}
  .ring svg{width:84px;height:84px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:9;stroke-linecap:round}
  .ring .bg{stroke:var(--turq-soft)}
  .ring .fg{stroke:var(--turq-deep);transition:stroke-dashoffset .8s ease}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem}
  .hello h2{margin:0;font-size:1.3rem;text-wrap:balance}
  .hello p{margin:2px 0 0;color:var(--coffee-mid);font-size:.95rem}
  .out{appearance:none;border:0;background:none;color:var(--coffee-mid);font:inherit;font-weight:700;font-size:.9rem;text-decoration:underline;padding:8px 0 0;cursor:pointer}
  .sec{font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--coffee-mid);margin:24px 4px 10px}
  a.test{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 4px 14px rgba(78,52,38,.07);transition:transform .12s}
  a.test:active{transform:scale(.985)}
  .g{flex:none;width:50px;height:50px;border-radius:15px;background:var(--turq-soft);color:var(--turq-deep);font-weight:800;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
  .mid{flex:1;min-width:0}
  .t{font-weight:800;font-size:1.02rem;display:block}
  .d{color:var(--coffee-mid);font-size:.88rem;display:block;margin-top:2px}
  .stars{letter-spacing:2px;font-size:1.05rem;color:#d9cdbd}
  .stars i{font-style:normal;color:var(--gold)}
  .pill{flex:none;font-weight:800;font-size:.82rem;border-radius:99px;padding:8px 13px;white-space:nowrap}
  .pill.new{background:var(--coffee);color:#fff}
  .pill.again{background:var(--turq-soft);color:var(--turq-deep)}
  .empty{color:var(--coffee-mid);text-align:center;padding:26px 8px}
  @media (max-width:340px){.gbtn{font-size:1.05rem;min-height:50px}.pill{padding:7px 10px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="config.js"></script>
<script src="portal.js"></script>
</head>
<body>
<header class="top">
  <svg viewBox="0 0 400 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
    <path d="M22 118h70M30 112v12M48 112v12M66 112v12M84 112v12"/>
    <circle cx="350" cy="40" r="20"/><path d="M350 20v40M330 40h40"/>
    <path d="M300 122l22-38 22 38z"/>
    <path d="M40 28l16 16M56 28l-16 16"/>
    <path d="M364 104h20M374 94v20"/>
    <path d="M96 50h22M96 62h22"/>
  </svg>
  <h1 id="headline">Ready for today's challenge?</h1>
  <p id="sub">Pick your grade and sign in.</p>
</header>
<main>
  <noscript><div class="card">Open this link in Safari or Chrome.</div></noscript>

  <form class="card" id="login" autocomplete="off">
    <span class="lab" id="gl">My grade</span>
    <div class="grades" id="grades" role="group" aria-labelledby="gl"></div>
    <button class="staff" type="button" id="staff" aria-pressed="false">Teacher / Admin</button>
    <label class="lab" for="name">User name</label>
    <input type="text" id="name" required autocapitalize="words" autocomplete="off" placeholder="Your name">
    <label class="lab" for="pw">Password</label>
    <div class="pw">
      <input type="password" id="pw" required autocomplete="off" placeholder="Your password">
      <button class="eye" type="button" id="eye" aria-pressed="false" aria-label="Show password">Show</button>
    </div>
    <p class="err" id="err" hidden></p>
    <button class="go" id="go" type="submit">Let's go</button>
  </form>

  <section id="home" hidden>
    <div class="card hello">
      <div class="ring" id="ring" aria-hidden="true">
        <svg viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="36"/><circle class="fg" id="ringFg" cx="42" cy="42" r="36"/></svg>
        <b id="ringTxt"></b>
      </div>
      <div>
        <h2 id="welcome"></h2>
        <p id="progress"></p>
        <button class="out" type="button" id="out">Sign out</button>
      </div>
    </div>
    <div class="sec">Your tests</div>
    <div id="tests"></div>
  </section>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var grades=window.PORTAL_GRADES||[], chosen='', box=$('grades');
  function pick(v){
    chosen=v;
    var bs=box.querySelectorAll('.gbtn'),i;
    for(i=0;i<bs.length;i++) bs[i].setAttribute('aria-pressed',bs[i].getAttribute('data-g')===v?'true':'false');
    $('staff').setAttribute('aria-pressed',v==='staff'?'true':'false');
    $('err').hidden=true;
  }
  grades.forEach(function(g){
    var b=document.createElement('button'); b.type='button'; b.className='gbtn'; b.textContent=g;
    b.setAttribute('data-g',g); b.setAttribute('aria-pressed','false'); b.setAttribute('aria-label','Grade '+g);
    b.addEventListener('click',function(){pick(g);}); box.appendChild(b);
  });
  $('staff').addEventListener('click',function(){pick('staff');});
  $('eye').addEventListener('click',function(){
    var p=$('pw'), show=p.type==='password';
    p.type=show?'text':'password'; this.textContent=show?'Hide':'Show';
    this.setAttribute('aria-pressed',show?'true':'false'); this.setAttribute('aria-label',show?'Hide password':'Show password');
  });

  function stars(best,total){
    var pct=total?best/total*100:0, n=pct>=100?3:pct>=80?2:pct>=50?1:0, s=document.createElement('span'), i, e;
    s.className='stars'; s.setAttribute('aria-label',n+' of 3 stars');
    for(i=0;i<3;i++){ if(i<n){e=document.createElement('i');e.textContent='★';s.appendChild(e);} else s.appendChild(document.createTextNode('★')); }
    return s;
  }
  function renderTests(s){
    var wrap=$('tests'); wrap.textContent='';
    var list=(s.tests||[]).filter(function(t){return /^[\w-]+\.html$/.test(t.file);});
    var done=list.filter(function(t){return t.attempts>0;}).length;
    var C=2*Math.PI*36, fg=$('ringFg');
    fg.style.strokeDasharray=C; fg.style.strokeDashoffset=C*(1-(list.length?done/list.length:0));
    $('ringTxt').textContent=done+'/'+list.length;
    $('progress').textContent=!list.length?'No tests yet':done===list.length?'All tests done. Beat your best!':done+' of '+list.length+' tests done';
    if(!list.length){var e=document.createElement('div');e.className='card empty';e.textContent='No tests for you yet. Check back soon.';wrap.appendChild(e);return;}
    list.forEach(function(t){
      var a=document.createElement('a'); a.className='test'; a.href=t.file;
      var g=document.createElement('span'); g.className='g'; g.textContent=t.grade;
      var m=document.createElement('span'); m.className='mid';
      var tt=document.createElement('span'); tt.className='t'; tt.textContent=t.title;
      var d=document.createElement('span'); d.className='d';
      var p=document.createElement('span'); p.className='pill';
      m.appendChild(tt);
      if(t.attempts>0){
        d.appendChild(stars(t.best,t.total)); d.appendChild(document.createTextNode('  Best '+t.best+'/'+t.total));
        p.className+=' again'; p.textContent='Try again';
      }else{
        d.textContent=(t.questions?t.questions+' questions':'');
        p.className+=' new'; p.textContent='Start';
      }
      m.appendChild(d); a.appendChild(g); a.appendChild(m); a.appendChild(p); wrap.appendChild(a);
    });
  }
  function showHome(s){
    $('login').hidden=true; $('home').hidden=false;
    $('headline').textContent='Math Tests';
    $('sub').textContent=s.role==='student'?'Grade '+s.grade:(s.role==='admin'?'Admin':'Teacher');
    $('welcome').textContent='Welcome, '+s.name.split(' ')[0];
    renderTests(s);
  }
  function showLogin(){
    $('home').hidden=true; $('login').hidden=false;
    $('headline').textContent="Ready for today's challenge?"; $('sub').textContent='Pick your grade and sign in.';
  }

  var MSG={invalid:'Grade, user name or password is not correct.',
           locked:'Too many tries. Wait 10 minutes.',
           not_configured:'Sign-in is not set up yet.',
           network:'No connection. Try again.'};

  $('login').addEventListener('submit',function(ev){
    ev.preventDefault();
    var err=$('err'), go=$('go');
    if(!chosen){err.textContent='Tap your grade first.'; err.hidden=false; return;}
    err.hidden=true; go.disabled=true; go.textContent='Checking…';
    Portal.login(chosen,$('name').value,$('pw').value,function(r){
      go.disabled=false; go.textContent="Let's go";
      $('pw').value='';
      if(r.ok){showHome(Portal.session());}
      else{err.textContent=MSG[r.error]||MSG.network; err.hidden=false;}
    });
  });
  $('out').addEventListener('click',function(){Portal.signOut();});

  var s=Portal.session();
  if(s){ showHome(s); Portal.refreshTests(function(){ var n=Portal.session(); if(n){renderTests(n);} else {showLogin();} }); }
})();
</script>
</body>
</html>
